<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px -apple-system;padding:16px;color:#283022}h2{font-size:18px}p{line-height:1.7}</style><h2>安装后即可使用</h2><p>建议先退出旧版「合盖不眠」。应用将安装到「应用程序」文件夹。打开后点击按钮即可开启，再次点击或关闭窗口恢复原来的休眠设置。</p><p>辅助服务由 macOS 管理，只接受本版本应用的防休眠、恢复和状态请求。不会保存管理员密码。服务随系统启动，平时保持待命。</p><p>合盖后内置屏幕仍会关闭。开启期间 Mac 保持运行，也会阻止手动系统睡眠。请保持通风，留意电量。</p><p>如需卸载，先关闭开关，然后从应用菜单选择「卸载系统辅助服务」，最后将应用移至废纸篓。卸载或重新安装属于系统维护，可能再次要求管理员授权。</p><p>此构建使用本地临时签名，未经过 Apple 开发者签名和公证。</p></html>
